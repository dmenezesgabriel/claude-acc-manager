# Hooks run on every `git commit`. Install with:
#   uv run pre-commit install

default_language_version:
  python: python3.12

repos:
  # ── General hygiene ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: debug-statements

  # ── Ruff: linter + formatter ──────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10  # pinned to match pyproject.toml dev dep
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # ── Local tools (use uv run to respect the project venv) ─────────
  - repo: local
    hooks:
      # Correctness lint for workflows — the surface zizmor (security) does
      # not cover. actionlint-py is sdist-only: it fetches the upstream
      # binary at build and verifies it against SHA256s embedded in the
      # sdist (integrity chain: uv.lock → sdist → release asset). shellcheck
      # is intentionally absent — actionlint skips run:-step shell lint
      # without it rather than failing, and our run: steps are one-liners.
      - id: actionlint
        name: actionlint (workflow linter)
        language: system
        entry: uv run actionlint
        files: ^\.github/workflows/

      - id: pyright
        name: pyright (type checker)
        language: system
        entry: uv run pyright src
        types: [python]
        pass_filenames: false

      - id: deptry
        name: deptry (dependency audit)
        language: system
        entry: uv run deptry src
        pass_filenames: false
        always_run: true

      - id: bandit
        name: bandit (security linter)
        language: system
        entry: uv run bandit -r src -ll
        types: [python]
        pass_filenames: false

      - id: vulture
        name: vulture (dead code detector)
        language: system
        entry: uv run vulture src --min-confidence 80
        types: [python]
        pass_filenames: false

      - id: xenon
        name: xenon (cyclomatic complexity)
        language: system
        entry: uv run xenon src --max-absolute B --max-modules B --max-average A
        types: [python]
        pass_filenames: false

      - id: import-linter
        name: import-linter (architecture contracts)
        language: system
        entry: bash -c 'PYTHONPATH=src uv run lint-imports'
        pass_filenames: false
        always_run: true

      # Last so fast static checks report first. Integration tests stay opt-in
      # (docs/architecture.md §10): they hit the real Anthropic API.
      - id: pytest-unit
        name: pytest (unit suite, 95% branch coverage floor)
        language: system
        entry: nice -n 10 uv run pytest test/unit --cov --cov-branch --cov-fail-under=95
        types: [python]
        pass_filenames: false

      # After pytest: green tests are the precondition for mutation testing.
      # mutmut run/results always exit 0, so the gate greps `mutmut results`
      # (prints every non-killed mutant): grep exit 0 = disqualifying status
      # found → `!` makes the hook fail. Skipped = # pragma: no mutate (in-band
      # exclusion, docs/architecture.md §10). Incremental: a warm cache only re-tests mutants of
      # changed functions (mutmut 3 execution model).
      - id: mutmut-gate
        name: mutmut (mutation gate — block on any non-killed, non-skipped mutant)
        language: system
        # Worker cap: mutmut defaults to os.cpu_count(), i.e. 8 on this host —
        # logical threads on 4 physical cores. Measured 2026-10-09: one pytest
        # worker peaks ~660 MiB and the 2-worker tree ~450 MiB; the uncapped
        # gate fed the kernel OOM that killed a chrome-headless that same day
        # (17:29). Default 2 keeps the gate on a shared multi-repo host;
        # MUTMUT_MAX_CHILDREN overrides (e.g. 8 when idle). CI needs no
        # override — the 2-vCPU ubuntu-24.04 runner already defaults to 2.
        # nice -n 10 yields CPU under contention without slowing an idle host.
        entry: "bash -c 'nice -n 10 uv run mutmut run --max-children ${MUTMUT_MAX_CHILDREN:-2} && ! uv run mutmut results | grep -E \": (survived|no tests|suspicious|timeout|segfault|not checked)$\"'"
        pass_filenames: false
        always_run: true

      # Last, after the pytest/mutmut env work: `uv run --group docs`
      # reconciles .venv to include the docs group, and a plain `uv run`
      # would prune it again — running the site build after the test hooks
      # keeps each sync one-directional. `files:` covers the complete build
      # input set (docs/** + mkdocs.yml), so under --all-files the gate job
      # always runs it — same command the `docs` CI job runs.
      # NO_MKDOCS_2_WARNING silences the vendor banner mkdocs-material
      # prints to stderr on every invocation (the package's own opt-out).
      - id: mkdocs-build
        name: mkdocs build --strict (site build + nav/link validation)
        language: system
        entry: env NO_MKDOCS_2_WARNING=1 uv run --group docs mkdocs build --strict
        files: ^(docs/|mkdocs\.yml$)
        pass_filenames: false

  # ── Conventional commits ─────────────────────────────────────────
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        # docs/architecture.md §10 types; scopes are component names
        args: ["feat", "fix", "test", "refactor", "chore", "docs", "build", "ci", "perf"]
