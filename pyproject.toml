[project]
name = "claude-acc-manager"
version = "0.1.0"
description = "Linux-only CLI/TUI to manage, measure, and swap Claude Code OAuth subscription accounts."
requires-python = ">=3.12"
# textual pin mirrors claude-swap's proven constraint (research_repos/claude-swap pyproject)
dependencies = [
    "textual>=8.2.8,<9",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "deptry==0.25.1",
    "import-linter==2.11",
    "pre-commit==4.6.1",
    "pyright==1.1.410",
    "pytest==9.1.0",
    "pytest-cov==7.1.0",
    "radon==6.0.1",
    "ruff==0.15.17",
    "vulture==2.16",
    "xenon==0.9.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_acc_manager"]
