[project]
name = "claude-acc-manager"
version = "1.0.0"
description = "Linux-only CLI/TUI to manage, measure, and swap Claude Code OAuth subscription accounts."
requires-python = ">=3.12"
# textual pinned to the v8 API surface the TUI is written against
dependencies = [
    "rich>=14.2,<16",
    "textual>=8.2.8,<9",
]

[project.scripts]
cam = "claude_acc_manager.__main__:main"

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "deptry==0.25.1",
    "import-linter==2.15",
    "mutmut==3.8.0",
    "pre-commit==4.6.2",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "radon==6.0.1",
    "ruff==0.16.10",
    "vulture==2.16",
    "xenon==0.9.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_acc_manager"]

[tool.pytest.ini_options]
# "test" is on the path for the shared named fakes in test/support/ (docs/architecture.md §10);
# pytest still only collects test_*.py, so the fakes are import-only.
pythonpath = ["src", "test"]
# Collect only this project's own tests — the repo root also holds untracked
# third-party source trees and mutmut's `mutants/` working copy.
testpaths = ["test"]
# -m "not integration": the integration suite hits the real Anthropic API and
# spends this machine's usage budget, so it is opt-in — `pytest -m integration`
# overrides this (the last -m wins). Also keeps it out of the coverage
# denominator, matching the marker's contract (docs/architecture.md §10).
# --import-mode=importlib: the default "prepend" mode requires every test
# module to have a globally unique basename absent an __init__.py per dir
# (docs/architecture.md §10 has neither — test dirs mirror src with no package inits). The
# component layout is deliberately symmetric (accounts/infrastructure/ and
# usage/infrastructure/ both have a system_clock.py, both get a
# test_system_clock.py) — importlib mode collects same-named files from
# different directories without a collision, matching that convention
# instead of fighting it.
addopts = "-q -m 'not integration' --import-mode=importlib"
# Textual Pilot tests are plain ``async def`` — auto mode collects them
# without per-class marks, and sync tests in the same module stay unmarked.
asyncio_mode = "auto"
markers = [
    "integration: hits real Anthropic API — run explicitly with -m integration",
]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# D: pydocstyle  E/W: pycodestyle  F: pyflakes  I: isort  B: bugbear  UP: pyupgrade  N: pep8-naming
select = ["D", "E", "W", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test method names are self-documenting; docstrings on every test would be
# boilerplate noise (datastudio practice).
"test/**/*.py" = ["D"]

[tool.bandit]
targets = ["src"]
# pre-commit hook passes -ll (report LOW severity and above); keep in sync if changing

[tool.mutmut]
source_paths = ["src/"]
pytest_add_cli_args_test_selection = ["test/unit"]
# The composition root is pure wiring plus the one ambient read of os.environ /
# Path.home() that every seam in the codebase exists to avoid — it cannot be
# exercised hermetically (docs/architecture.md §8). build_use_cases is still covered for real
# by test/unit/test_main.py; only the un-mutatable entrypoint is excluded here.
do_not_mutate = ["src/claude_acc_manager/__main__.py"]

[tool.vulture]
min_confidence = 80
paths = ["src"]

[tool.radon]
# Thresholds enforced by xenon in pre-commit; this section controls `radon cc` CLI defaults
cc_min = "A"
show_complexity = true
average = true

[tool.coverage.run]
source = ["src/claude_acc_manager"]
branch = true
omit = [
    "*/__pycache__/*",
    # Composition root: wiring + the ambient os.environ / Path.home() read that
    # cannot run under a hermetic test. build_use_cases is exercised for real by
    # test/unit/test_main.py (it just does not count toward the branch floor).
    "*/claude_acc_manager/__main__.py",
]

[tool.coverage.report]
show_missing = true
# Plan §3: coverage floor 95%, enforced in the pre-commit pytest hook
fail_under = 95

[tool.deptry]
# DEP004: pytest/pytest-cov in test files are dev deps used as intended
ignore = ["DEP004"]

# Architectural boundaries — run with `PYTHONPATH=src uv run lint-imports`.
# lint-imports does not read pytest's `pythonpath`, so src must be on PYTHONPATH.
[tool.importlinter]
root_packages = ["claude_acc_manager"]
include_external_packages = true

# Plan §4.1 contracts; they grow per milestone as components come into being.
[[tool.importlinter.contracts]]
name = "shared imports no component"
type = "forbidden"
source_modules = ["claude_acc_manager.shared"]
forbidden_modules = ["claude_acc_manager.accounts"]

[[tool.importlinter.contracts]]
name = "accounts domain stays pure"
type = "forbidden"
source_modules = ["claude_acc_manager.accounts.domain"]
forbidden_modules = [
    "claude_acc_manager.accounts.application",
    "claude_acc_manager.accounts.infrastructure",
]

[[tool.importlinter.contracts]]
name = "accounts application imports domain only"
type = "forbidden"
source_modules = ["claude_acc_manager.accounts.application"]
forbidden_modules = ["claude_acc_manager.accounts.infrastructure"]

# Adapters may import the port they implement (AGENTS.md: subclass the port
# explicitly) — that one import is the sanctioned cross-layer exception.
[[tool.importlinter.contracts]]
name = "accounts infrastructure imports domain and ports only"
type = "forbidden"
source_modules = ["claude_acc_manager.accounts.infrastructure"]
forbidden_modules = ["claude_acc_manager.accounts.application"]
ignore_imports = [
    "claude_acc_manager.accounts.infrastructure.file_account_store -> claude_acc_manager.accounts.application.ports",
    "claude_acc_manager.accounts.infrastructure.claude_locks -> claude_acc_manager.accounts.application.ports",
    "claude_acc_manager.accounts.infrastructure.claude_login_launcher -> claude_acc_manager.accounts.application.ports",
    "claude_acc_manager.accounts.infrastructure.account_dir_files -> claude_acc_manager.accounts.application.ports",
    "claude_acc_manager.accounts.infrastructure.unclaimed_store -> claude_acc_manager.accounts.application.ports",
    "claude_acc_manager.accounts.infrastructure.system_clock -> claude_acc_manager.accounts.application.ports",
    "claude_acc_manager.accounts.infrastructure.account_credential_store -> claude_acc_manager.accounts.application.ports",
    "claude_acc_manager.accounts.infrastructure.ops_lock -> claude_acc_manager.accounts.application.ports",
    "claude_acc_manager.accounts.infrastructure.claude_contract_probe -> claude_acc_manager.accounts.application.ports",
]

[[tool.importlinter.contracts]]
name = "accounts use cases import domain and ports only"
type = "forbidden"
source_modules = ["claude_acc_manager.accounts.application.use_cases"]
forbidden_modules = ["claude_acc_manager.accounts.infrastructure"]
ignore_imports = [
    "claude_acc_manager.accounts.application.use_cases.* -> claude_acc_manager.accounts.application.ports",
]

# The CLI dispatch stays thin (ADR-0010): it reaches the components
# only through use cases + domain value objects. The concrete adapters are
# wired in claude_acc_manager.__main__, the composition root (not covered by
# this contract — someone has to construct the adapters).
[[tool.importlinter.contracts]]
name = "cli dispatch imports use cases and ports only"
type = "forbidden"
source_modules = ["claude_acc_manager.cli", "claude_acc_manager.cli.*"]
forbidden_modules = [
    "claude_acc_manager.accounts.infrastructure",
    "claude_acc_manager.usage.infrastructure",
    "claude_acc_manager.settings.infrastructure",
    "claude_acc_manager.auto.infrastructure",
]

[[tool.importlinter.contracts]]
name = "settings domain stays pure"
type = "forbidden"
source_modules = ["claude_acc_manager.settings.domain"]
forbidden_modules = [
    "claude_acc_manager.settings.application",
    "claude_acc_manager.settings.infrastructure",
]

[[tool.importlinter.contracts]]
name = "settings application imports domain only"
type = "forbidden"
source_modules = ["claude_acc_manager.settings.application"]
forbidden_modules = ["claude_acc_manager.settings.infrastructure"]

[[tool.importlinter.contracts]]
name = "settings infrastructure imports domain and ports only"
type = "forbidden"
source_modules = ["claude_acc_manager.settings.infrastructure"]
forbidden_modules = ["claude_acc_manager.settings.application"]
ignore_imports = [
    "claude_acc_manager.settings.infrastructure.file_settings -> claude_acc_manager.settings.application.ports",
]

[[tool.importlinter.contracts]]
name = "auto domain stays pure"
type = "forbidden"
source_modules = ["claude_acc_manager.auto.domain"]
forbidden_modules = [
    "claude_acc_manager.auto.application",
    "claude_acc_manager.auto.infrastructure",
]

[[tool.importlinter.contracts]]
name = "auto application imports domain and ports only"
type = "forbidden"
source_modules = ["claude_acc_manager.auto.application"]
forbidden_modules = ["claude_acc_manager.auto.infrastructure"]

[[tool.importlinter.contracts]]
name = "auto infrastructure imports domain and ports only"
type = "forbidden"
source_modules = ["claude_acc_manager.auto.infrastructure"]
forbidden_modules = ["claude_acc_manager.auto.application"]
ignore_imports = [
    "claude_acc_manager.auto.infrastructure.file_auto_state -> claude_acc_manager.auto.application.ports",
]

[[tool.importlinter.contracts]]
name = "usage domain stays pure"
type = "forbidden"
source_modules = ["claude_acc_manager.usage.domain"]
forbidden_modules = [
    "claude_acc_manager.usage.application",
    "claude_acc_manager.usage.infrastructure",
]

[[tool.importlinter.contracts]]
name = "usage application imports domain only"
type = "forbidden"
source_modules = ["claude_acc_manager.usage.application"]
forbidden_modules = ["claude_acc_manager.usage.infrastructure"]

[[tool.importlinter.contracts]]
name = "usage use cases import domain and ports only"
type = "forbidden"
source_modules = ["claude_acc_manager.usage.application.use_cases"]
forbidden_modules = ["claude_acc_manager.usage.infrastructure"]
ignore_imports = [
    "claude_acc_manager.usage.application.use_cases.* -> claude_acc_manager.usage.application.ports",
]

[[tool.importlinter.contracts]]
name = "usage infrastructure imports domain and ports only"
type = "forbidden"
source_modules = ["claude_acc_manager.usage.infrastructure"]
forbidden_modules = ["claude_acc_manager.usage.application"]
ignore_imports = [
    "claude_acc_manager.usage.infrastructure.http_transport -> claude_acc_manager.usage.application.ports",
    "claude_acc_manager.usage.infrastructure.anthropic_oauth -> claude_acc_manager.usage.application.ports",
    "claude_acc_manager.usage.infrastructure.system_clock -> claude_acc_manager.usage.application.ports",
    "claude_acc_manager.usage.infrastructure.file_usage_cache -> claude_acc_manager.usage.application.ports",
    "claude_acc_manager.usage.infrastructure.claude_contract_probe -> claude_acc_manager.usage.application.ports",
]

# M4 evidence (ADR-0010): "accounts may import usage, never the
# reverse" — this is the reverse-direction half of that rule, enforced from
# usage's side before any code could accidentally violate it.
[[tool.importlinter.contracts]]
name = "usage never imports accounts"
type = "forbidden"
source_modules = ["claude_acc_manager.usage"]
forbidden_modules = ["claude_acc_manager.accounts"]

# The TUI is a second transport (ADR-0010): it reaches the components only
# through use cases + domain types — never adapters — and never the other
# transport. Its use-case surface is the structural TuiUseCases Protocol in
# tui/app.py, so no cli import is needed at all.
[[tool.importlinter.contracts]]
name = "tui imports use cases and ports only"
type = "forbidden"
source_modules = ["claude_acc_manager.tui", "claude_acc_manager.tui.*"]
forbidden_modules = [
    "claude_acc_manager.accounts.infrastructure",
    "claude_acc_manager.usage.infrastructure",
    "claude_acc_manager.settings.infrastructure",
    "claude_acc_manager.auto.infrastructure",
    "claude_acc_manager.cli",
]
