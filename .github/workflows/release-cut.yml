name: Release cut

# CI-native release cutting (M28): semantic-release computes the bump from
# conventional commits exactly as it did in M18's local maintainer leg — what
# changed is who runs it and where. On every main push (and on demand) this
# workflow re-cuts the standing release/next branch and its PR, so a release
# PR is always current. Auto-merge lands it once the nine required checks
# pass; release-tag.yml then tags the merge commit.
#
# Why a GitHub App, not GITHUB_TOKEN: events authored by GITHUB_TOKEN never
# trigger new workflow runs — a bot-pushed branch would get zero check runs
# and stay unmergeable under the required-checks ruleset, a bot-armed
# auto-merge would suppress the main-branch CI run, and a bot-pushed tag
# would not fire release.yml. The app token is a real actor, so every event
# fires normally. Missing credentials (a fork, an unconfigured repo) degrade
# to a warning, never a red run — ai-usagebar's AUR_SSH_KEY pattern.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Default-deny: a job inherits {} unless it re-declares scopes. The app
# token — not GITHUB_TOKEN — carries the write surface.
permissions: {}

# A newer main always supersedes a stale cut: the next push recomputes from
# a newer HEAD, so cancelling an in-flight cut loses nothing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  # Every uv invocation must verify the lockfile, never silently relock.
  UV_LOCKED: "1"

jobs:
  cut:
    name: cut
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Fork guard: a fork's push must never reach this repo's release machinery.
    if: github.repository == 'dmenezesgabriel/claude-acc-manager'
    permissions:
      contents: read
    steps:
      # create-github-app-token errors on empty inputs, so presence is
      # checked first — the run stays green-but-idle until the credential
      # pair (client-id var + private-key secret) exists.
      - name: App credentials configured?
        id: preflight
        env:
          CAM_APP_ID: ${{ vars.CAM_RELEASE_CLIENT_ID }}
          CAM_APP_KEY: ${{ secrets.CAM_RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$CAM_APP_ID" ] || [ -z "$CAM_APP_KEY" ]; then
            echo "::warning::CAM_RELEASE_CLIENT_ID / CAM_RELEASE_APP_PRIVATE_KEY not set — skipping release cut"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - id: app
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CAM_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.CAM_RELEASE_APP_PRIVATE_KEY }}
          owner: dmenezesgabriel
          repositories: claude-acc-manager
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.preflight.outputs.configured == 'true'
        with:
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
          # psr computes the bump from tags and history — a shallow clone
          # would misjudge the last release.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.preflight.outputs.configured == 'true'
        with:
          version: "0.11.8"
          checksum: "56dd1b66701ecb62fe896abb919444e4b83c5e8645cca953e6ddd496ff8a0feb"

      - name: Rebuild release/next with the next version's release commit
        id: cut
        if: steps.preflight.outputs.configured == 'true'
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          git fetch origin main release/next 2>/dev/null || git fetch origin main

          NEXT="$(uv run semantic-release version --print 2>/dev/null | grep -m1 -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          # --print still echoes the current version when nothing is
          # bumpable ("No release will be made") — the decisive check is
          # whether that tag already exists, matching psr's own logic.
          # NEXT == the version on main means the release commit just landed
          # and this push is its self-trigger: the tag push (release-tag.yml)
          # can still be in flight, so the tag check alone would rebuild an
          # already-merged release (observed on run 38482737598).
          CURRENT="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          if [ -z "$NEXT" ] || [ "$NEXT" = "$CURRENT" ] \
            || git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null 2>&1; then
            echo "nothing to release (next=${NEXT:-none}; current=${CURRENT})"
            echo "next=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

          # Noreply committer email is <bot-user-id>+<slug>[bot]@... — the ID
          # is the app bot's *user* id (resolved via API), never the app or
          # client id (create-github-app-token README).
          BOT_USER_ID="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          # release/next is bot-owned: -C resets it onto main, the upstream
          # push (psr verifies it exists) then force-with-lease keeps any
          # human push to the branch from being silently clobbered.
          git switch -C release/next origin/main
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease -u origin release/next

          # Upstream bug (psr ≤10.7.0): `version --no-tag` in a GITHUB_OUTPUT
          # env crashes writing step outputs — commit_sha is only assigned
          # under `create_tag` (cli/commands/version.py), so released=true +
          # no-tag raises ValueError. We read stdout, not step outputs, so
          # unset the sink for this call.
          env -u GITHUB_OUTPUT uv run semantic-release version --no-tag --no-vcs-release --no-push
          git push --force-with-lease origin release/next

      - name: Open or refresh the standing release PR, then arm auto-merge
        if: steps.preflight.outputs.configured == 'true' && steps.cut.outputs.next != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NEXT: ${{ steps.cut.outputs.next }}
          PR_BODY: |
            Cut by `.github/workflows/release-cut.yml` — semantic-release derived
            this version from conventional commits since the last tag. Auto-merge
            is armed: the PR lands once the nine required checks pass, then
            `.github/workflows/release-tag.yml` tags the merge commit and
            `release.yml` publishes. The only remaining human act is the `pypi`
            environment approval on the deploy job.
        run: |
          set -euo pipefail
          # Only an OPEN PR counts: `gh pr view <branch>` also matches the
          # merged standing PR, which made the post-release cut retitle the
          # dead PR and strand the next release commit (observed on run
          # 38484438324 — v1.2.2 cut with no PR to merge).
          OPEN_PR="$(gh pr list --head release/next --state open --json number --jq '.[0].number')"
          if [ -z "$OPEN_PR" ]; then
            gh pr create --head release/next --base main \
              --title "chore(release): v${NEXT}" --body "$PR_BODY" >/dev/null
            OPEN_PR="$(gh pr list --head release/next --state open --json number --jq '.[0].number')"
          else
            gh pr edit "$OPEN_PR" --title "chore(release): v${NEXT}"
          fi
          if ! gh pr merge "$OPEN_PR" --rebase --auto --delete-branch; then
            echo "::error::could not arm auto-merge — enable it in Settings → General → Pull Requests, or merge this PR manually"
            exit 1
          fi
