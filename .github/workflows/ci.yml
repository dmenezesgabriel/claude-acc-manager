name: CI

# The required merge gate. `gate` runs `pre-commit run --all-files`
# verbatim so CI can never pass what a commit cannot; `test` re-runs the
# suite across the advertised requires-python range. The duplication is
# intentional — gate proves the whole-repo gate at the pinned version,
# the matrix proves the version surface. The scanner battery lives in
# security.yml, which also owns the weekly drift cron.
#
# Job `name:` values are the required-check API — the default-branch
# ruleset binds these names. Renaming one requires updating the ruleset
# in the same commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default-deny: a job inherits {} unless it re-declares scopes. Every job
# needs at least `contents: read` — a zero-scope GITHUB_TOKEN cannot even
# clone the repo (checkout 404s on private, and reads stay token-scoped).
permissions: {}

# Sha-keyed so consecutive main pushes never cancel each other — a ref-keyed
# group would kill the in-flight main run and lose its coverage signal and
# mutmut cache banking. PR pushes share the pull_request.number key, so a
# fresh push still cancels a stale PR run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # Every uv invocation must verify the lockfile, never silently relock.
  UV_LOCKED: "1"

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-env

      # mutants/ is mutmut's workdir: it doubles as the incremental cache,
      # and a cold ~9k-mutant pass already exceeded a 60-min timeout once.
      # Split restore/save so even a killed run banks progress — plain
      # actions/cache only saves on success and the cache would never warm.
      # The key partitions on the TEST tree: mutmut re-runs mutants when
      # their source function changes but trusts verdicts across test edits,
      # so a restore matching a different test/ would replay stale
      # survived/killed results verbatim (observed: 0 mutants re-tested).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mutants/
          key: mutants-t${{ hashFiles('test/**') }}-${{ github.run_id }}
          restore-keys: mutants-t${{ hashFiles('test/**') }}-

      - name: Full local gate (lint, types, contracts, tests ≥95% branch, mutants)
        run: uv run pre-commit run --all-files

      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mutants/
          key: mutants-t${{ hashFiles('test/**') }}-${{ github.run_id }}

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # `.python-version` pins 3.12 — the env override is what makes the
      # matrix real; both `uv sync` and `uv run` honor it.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest
