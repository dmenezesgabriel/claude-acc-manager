name: CI

# The local gate is the contract — `gate` runs `pre-commit run --all-files`
# verbatim so CI can never pass what a commit cannot. `test` proves the
# advertised requires-python range; the weekly schedule exists so pip-audit
# catches CVEs published against already-locked deps.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Default-deny: every job that needs a scope re-declares it (ai-usagebar
# convention — `contents: read` there, `{}` here since nothing needs more).
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every uv invocation must verify the lockfile, never silently relock.
  UV_LOCKED: "1"

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.8"
          checksum: "56dd1b66701ecb62fe896abb919444e4b83c5e8645cca953e6ddd496ff8a0feb"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Full local gate (lint, types, contracts, tests ≥95% branch, mutants)
        run: uv run pre-commit run --all-files

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # `.python-version` pins 3.12 — the env override is what makes the
      # matrix real; both `uv sync` and `uv run` honor it.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.8"
          checksum: "56dd1b66701ecb62fe896abb919444e4b83c5e8645cca953e6ddd496ff8a0feb"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest
