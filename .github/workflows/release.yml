name: Release

# The PyPI release pipeline (M18, attrs model): CI never pushes to main —
# the main-branch ruleset requires the nine checks on every commit, and a
# fresh release commit can never have run them yet. Since M28 the cut is
# automated: release-cut.yml rebuilds the standing release/next PR on every
# main push (semantic-release does the version math from conventional
# commits — the input format the commit-msg hook already enforces), the PR
# passes the same gate as everything else, auto-merge lands it, and
# release-tag.yml pushes the annotated v{version} tag — not ruleset-
# restricted; the ruleset targets ~DEFAULT_BRANCH only — which triggers
# this workflow. It builds the dists from the tag and publishes them:
# GitHub Release with dist assets, TestPyPI (ungated canary), PyPI
# (reviewer-gated environment) — all via OIDC trusted publishing, no stored
# credentials.
#
# Manual fallback (unchanged M18 flow — run when the app is not configured):
#   git switch -c release/vX.Y.Z && git push -u origin release/vX.Y.Z
#   uvx --from python-semantic-release==10.7.0 semantic-release version \
#     --no-tag --no-vcs-release
#   gh pr create ... && gh pr merge --rebase   # nine checks run on it
#   git switch main && git pull
#   git tag -a "v$(uvx --from python-semantic-release==10.7.0 \
#     semantic-release version --print)" -m ... && git push origin "v$(...)"
#
# `workflow_dispatch` with `ref` re-runs the pipeline against an existing
# tag (ai-usagebar's rebuild pattern) — publishes stay idempotent.
#
# PyPI-side bindings (one-time, both hosts): the trusted publishers on
# test.pypi.org and pypi.org pin workflow `release.yml` and environments
# `pypi-test` / `pypi` — renaming the workflow file or either environment
# breaks the OIDC exchange (observed: `invalid-publisher`).
#
# Fork guard on every job (attrs' defense in depth): a fork's tag push must
# never reach this repo's release machinery.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Existing release tag to rebuild (e.g. v1.2.0)"
        required: true

# Default-deny: a job inherits {} unless it re-declares scopes.
permissions: {}

# Publishes serialize per tag, never cancel: a mid-flight publish killed by
# a cancel would strand the release halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Every uv invocation must verify the lockfile, never silently relock.
  UV_LOCKED: "1"

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.repository == 'dmenezesgabriel/claude-acc-manager'
    permissions:
      contents: read
    steps:
      # Tag ref by default on a tag push — build exactly what the tag names.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
          # The on-main assertion below needs the default branch present.
          fetch-depth: 0

      - uses: $/.github/actions/setup-env

      # ai-usagebar's verify-version lesson, cheapened: the cut derives the
      # surfaces, so assert they agree before anything publishes. For a
      # dispatch ref the tag must also provably exist and point at main —
      # a rebuild must never publish an arbitrary commit.
      - name: Version surfaces must agree (tag == pyproject == uv.lock)
        env:
          RELEASE_TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::'$RELEASE_TAG' is not a vX.Y.Z tag"; exit 1; }
          git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null \
            || { echo "::error::tag '$RELEASE_TAG' does not exist"; exit 1; }
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" \
            refs/remotes/origin/main \
            || { echo "::error::tag '$RELEASE_TAG' does not point to a commit on main"; exit 1; }
          grep -Fqx "version = \"$version\"" pyproject.toml \
            || { echo "::error::pyproject.toml version is not $version"; exit 1; }
          grep -A1 -F 'name = "claude-acc-manager"' uv.lock | grep -Fqx "version = \"$version\"" \
            || { echo "::error::uv.lock version is not $version"; exit 1; }

      - name: Build dists
        run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # Separate job so the GH Release exists even if PyPI fails. The release
  # notes are the tag's own CHANGELOG section (ai-usagebar's extraction) —
  # PSR's publish-action is not used here: `semantic-release publish` refuses
  # to run on a detached-HEAD tag checkout ("cannot match any release
  # groups"), which is exactly what a tag-triggered job checks out.
  release:
    name: release (github.com)
    needs: build
    if: github.repository == 'dmenezesgabriel/claude-acc-manager'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the GH Release, upload dist assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # PSR's changelog headers are "## vX.Y.Z (date)" — prefix-match the
          # tag's section, stop at the next "## v" header (dots stay literal).
          awk -v ver="$version" '
            BEGIN { hdr = "## v" ver }
            index($0, hdr) == 1 { flag = 1; next }
            flag && index($0, "## v") == 1 { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" --notes-file release-notes.md --latest
          fi

  # Ungated canary: every release lands on TestPyPI first so the artifact is
  # installable before the human approves the real publish. Independent of
  # `deploy` — a TestPyPI failure never blocks PyPI; the reviewer is the gate.
  deploy-test:
    name: deploy-test (test.pypi.org)
    needs: build
    if: github.repository == 'dmenezesgabriel/claude-acc-manager'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC proof for trusted publishing
    environment: pypi-test
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          print-hash: true
          # Rebuilt tags re-upload the same version — warn-and-skip keeps the
          # dispatch re-run green (ai-usagebar's already-exists → warn).
          skip-existing: true

  # The only reason this is a separate job: id-token: write lives here alone,
  # and the pypi environment's required reviewer makes every real publish a
  # human decision (PyPA guide recommendation).
  deploy:
    name: deploy (pypi.org)
    needs: build
    if: github.repository == 'dmenezesgabriel/claude-acc-manager'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC proof for trusted publishing
    environment: pypi
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          print-hash: true
          skip-existing: true # same rebuild idempotency as deploy-test
