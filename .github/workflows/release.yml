name: Release

# The PyPI release pipeline (M18, attrs model): CI never pushes to main —
# the main-branch ruleset requires the nine checks on every commit, and a
# fresh release commit can never have run them yet. Instead the maintainer
# cuts the release locally (python-semantic-release does the version math
# from conventional commits — the input format the commit-msg hook already
# enforces) and the release commit rides a normal PR, so it passes the same
# gate as everything else. Pushing the v{version} tag — not ruleset-
# restricted; the ruleset targets ~DEFAULT_BRANCH only — then triggers this
# workflow, which builds the dists from the tag and publishes them: GitHub
# Release with dist assets, TestPyPI (ungated canary), PyPI (reviewer-gated
# environment) — all via OIDC trusted publishing, no stored credentials.
#
# Maintainer flow per release (the release commit is chore(release), which
# is not a bumping type, so the tag names the version it carries; push the
# branch BEFORE cutting — PSR verifies the upstream state and errors on a
# branch with no upstream):
#   git switch -c release/vX.Y.Z && git push -u origin release/vX.Y.Z
#   uvx --from python-semantic-release==10.7.0 semantic-release version \
#     --no-tag --no-vcs-release
#   gh pr create ... && gh pr merge --rebase   # nine checks run on it
#   git switch main && git pull
#   git tag "v$(uvx --from python-semantic-release==10.7.0 \
#     semantic-release version --print)" && git push origin "v$(...)"
#
# PyPI-side bindings (one-time, both hosts): the trusted publishers on
# test.pypi.org and pypi.org pin workflow `release.yml` and environments
# `pypi-test` / `pypi` — renaming the workflow file or either environment
# breaks the OIDC exchange (observed: `invalid-publisher`).
#
# Fork guard on every job (attrs' defense in depth): a fork's tag push must
# never reach this repo's release machinery.
on:
  push:
    tags: ["v*"]

# Default-deny: a job inherits {} unless it re-declares scopes.
permissions: {}

# Publishes serialize per tag, never cancel: a mid-flight publish killed by
# a cancel would strand the release halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Every uv invocation must verify the lockfile, never silently relock.
  UV_LOCKED: "1"

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.repository == 'dmenezesgabriel/claude-acc-manager'
    permissions:
      contents: read
    steps:
      # Tag ref by default on a tag push — build exactly what the tag names.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-env

      # The three versions are derived independently — PSR bumps pyproject
      # and relocks locally, the tag is cut by hand — so a stale lock or a
      # mistyped tag would publish a dist that disagrees with the tag.
      # Assert all three agree before anything publishes.
      - name: Version surfaces must agree (tag == pyproject == uv.lock)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          grep -Fqx "version = \"$version\"" pyproject.toml \
            || { echo "::error::pyproject.toml version is not $version"; exit 1; }
          grep -A1 -F 'name = "claude-acc-manager"' uv.lock | grep -Fqx "version = \"$version\"" \
            || { echo "::error::uv.lock version is not $version"; exit 1; }

      - name: Build dists
        run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # Separate job so the GH Release exists even if PyPI fails. The release
  # notes are the tag's own CHANGELOG section, extracted verbatim —
  # PSR's publish-action is not used here: `semantic-release publish` refuses
  # to run on a detached-HEAD tag checkout ("cannot match any release
  # groups"), which is exactly what a tag-triggered job checks out.
  release:
    name: release (github.com)
    needs: build
    if: github.repository == 'dmenezesgabriel/claude-acc-manager'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the GH Release, upload dist assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # PSR's changelog headers are "## vX.Y.Z (date)" — prefix-match the
          # tag's section, stop at the next "## v" header (dots stay literal).
          awk -v ver="$version" '
            BEGIN { hdr = "## v" ver }
            index($0, hdr) == 1 { flag = 1; next }
            flag && index($0, "## v") == 1 { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" --notes-file release-notes.md --latest
          fi

  # Ungated canary: every release lands on TestPyPI first so the artifact is
  # installable before the human approves the real publish. Independent of
  # `deploy` — a TestPyPI failure never blocks PyPI; the reviewer is the gate.
  deploy-test:
    name: deploy-test (test.pypi.org)
    needs: build
    if: github.repository == 'dmenezesgabriel/claude-acc-manager'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC proof for trusted publishing
    environment: pypi-test
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          print-hash: true

  # The only reason this is a separate job: id-token: write lives here alone,
  # and the pypi environment's required reviewer makes every real publish a
  # human decision (PyPA guide recommendation).
  deploy:
    name: deploy (pypi.org)
    needs: build
    if: github.repository == 'dmenezesgabriel/claude-acc-manager'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC proof for trusted publishing
    environment: pypi
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          print-hash: true
