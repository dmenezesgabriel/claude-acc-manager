name: Scorecard

# Separate file from ci.yml: different cadence (default-branch pushes +
# weekly drift check, never PRs — pull_request is experimental upstream)
# and a permission profile nothing in ci.yml shares.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions: {}

# Sha-keyed so consecutive main pushes never cancel each other — a ref-keyed
# group would kill an in-flight run mid-publish. (This file has no
# pull_request trigger; the same expression is kept across workflows so the
# rule is learned once.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Results publishing (id-token OIDC) + SARIF upload need the repo public;
    # the guard keeps the job inert rather than failing if visibility flips
    # back to private.
    if: github.event.repository.visibility == 'public'
    permissions:
      contents: read # checkout
      security-events: write # upload results.sarif to code scanning
      id-token: write # OIDC for publish_results (scorecard.dev API)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
