name: Security

# The audit battery, kept out of ci.yml so the merge gate stays a
# single-concern file. The weekly cron lives here because it exists for
# external drift: pip-audit catches CVEs published against already-locked
# deps and CodeQL picks up new queries — neither needs a code change to
# go red. pip-audit and zizmor ride `uv run` so the versions come from
# uv.lock (hash-pinned), not from an action's bundled copy.
#
# Job `name:` values are the required-check API — the default-branch
# ruleset binds these names. Renaming one requires updating the ruleset
# in the same commit.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Default-deny: a job inherits {} unless it re-declares scopes. Every job
# needs at least `contents: read` — a zero-scope GITHUB_TOKEN cannot even
# clone the repo (checkout 404s on private, and reads stay token-scoped).
permissions: {}

# Sha-keyed so consecutive main pushes never cancel each other — a ref-keyed
# group would kill an in-flight audit mid-run. PR pushes share the
# pull_request.number key, so a fresh push still cancels a stale PR run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # Every uv invocation must verify the lockfile, never silently relock.
  UV_LOCKED: "1"

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-env

      # Audits the whole synced env — dev tools are supply-chain surface too.
      - name: Audit locked dependencies for CVEs
        run: uv run pip-audit

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-env

      # Plain format on purpose: --format=sarif always exits 0 (upstream
      # caveat), and SARIF upload needs GHAS — a blocking run fits the
      # "finding = defect" policy. Offline mode; no GH_TOKEN exported.
      # .github/ scope: audits composite actions under .github/actions/
      # alongside the workflows.
      - name: Lint workflows (pedantic, blocking)
        run: uv run zizmor --persona pedantic .github/

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history — a secret committed earlier is still a secret.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # The action calls users/<owner> to decide whether a
          # GITLEAKS_LICENSE is required (orgs only — this is a personal
          # repo). Unauthenticated that call shares the runner's 60/hr
          # rate-limit pool and flakily 403s into a hard license failure
          # (observed 2026-10-06); the token exists only to authenticate it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # SARIF upload needs code scanning — GHAS on private repos. The job is
    # written now so it activates the moment the repo is public; until then
    # this guard skips it instead of failing.
    if: github.event.repository.visibility == 'public'
    permissions:
      security-events: write # upload the analysis SARIF to code scanning
      actions: read # CodeQL reads workflow metadata for its analysis
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Python is interpreted — no autobuild step, analyze builds its own DB.
      - uses: github/codeql-action/init@88585263c0627ee42c0e1c5143a112c8d6f4aa18 # v4.38.2
        with:
          languages: python

      - uses: github/codeql-action/analyze@88585263c0627ee42c0e1c5143a112c8d6f4aa18 # v4.38.2
